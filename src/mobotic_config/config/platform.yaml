# Actual MoboTerra configuration used by native startup and receiver recovery.
# Four modules with miControl steering and traction; traction bounds are motor rpm.
# Existing miControl controller ramps are preserved; verify encoder scaling on hardware.
schema_version: 1
robot_name: moboterra
frames:
  base: base_link
  odom: odom
reference_corners:
- name: vehicle_front_left_corner
  xyz:
  - 1.2667297363
  - 0.9228179321
  - 0.0
- name: vehicle_front_right_corner
  xyz:
  - 1.2667297363
  - -0.9203035278
  - 0.0
- name: vehicle_rear_left_corner
  xyz:
  - -1.2671105957
  - 0.9228179321
  - 0.0
- name: vehicle_rear_right_corner
  xyz:
  - -1.2671105957
  - -0.9203035278
  - 0.0
can:
  master_node_id: '0x0B'
  drives:
    interface: can0
    bitrate: 500000
  battery:
    interface: can0
    bitrate: 500000
    listen_only: false
geometry:
  wheel_radius: 0.325
  wheel_width: 0.31
actuators:
  steering:
    # Installed 0x3762/0x3790 user units: motor revolutions, 121:1 gearbox.
    # Raw encoder increments (0x3772) have a separate scale.
    resolution: 121
    gear_ratio: 121.0
    mode: position
    min_steering_velocity: -5000
    max_steering_velocity: 5000
    min_traction_velocity: -5000
    max_traction_velocity: 5000
    min_current: -4000
    max_current: 4000
  traction:
    resolution: 4096
    gear_ratio: 16.0
    mode: velocity
    min_steering_velocity: -1700
    max_steering_velocity: 1700
    min_traction_velocity: -116053
    max_traction_velocity: 116053
    min_current: -4000
    max_current: 4000
traction_profile:
  max_velocity: 116053
  acceleration: 32093
  deceleration: 32093
motion_limits:
  max_velocity_linear: 2.0
  max_velocity_angular: 1.51
  max_acceleration_linear: 0.5
  max_acceleration_angular: 0.52
  max_steering_velocity: 0.3 # steering output rad/s
  steering_angle_limits_enabled: false # Continuous targets, as in Terra Spiro
  steering_return_home_on_neutral: true
  steering_neutral_home_velocity: 1.2 # steering output rad/s; normal joystick stays 0.3
  max_traction_velocity: 2.0 # wheel-contact m/s
  max_traction_current: 4.0
modules:
- name: front_left
  cad_steering_xyz:
  - 0.845
  - 0.495
  - 0.749955467
  mounting_yaw: 0.0
  steering:
    joint: front_left_steering
    can_node_id: '0x01'
    controller: miControl
  traction:
    joint: front_left_traction
    can_node_id: '0x02'
    controller: miControl
    min_traction_velocity: -1700
    max_traction_velocity: 1700
- name: front_right
  cad_steering_xyz:
  - 0.845
  - -0.495
  - 0.749910934
  mounting_yaw: 3.14152
  steering:
    joint: front_right_steering
    can_node_id: '0x03'
    controller: miControl
  traction:
    joint: front_right_traction
    can_node_id: '0x04'
    controller: miControl
    min_traction_velocity: -1700
    max_traction_velocity: 1700
- name: rear_left
  cad_steering_xyz:
  - -0.845
  - 0.495
  - 0.749955467
  mounting_yaw: 0.0
  steering:
    joint: rear_left_steering
    can_node_id: '0x07'
    controller: miControl
  traction:
    joint: rear_left_traction
    can_node_id: '0x08'
    controller: miControl
    min_traction_velocity: -1700
    max_traction_velocity: 1700
- name: rear_right
  cad_steering_xyz:
  - -0.845
  - -0.495
  - 0.75
  mounting_yaw: 3.14152
  steering:
    joint: rear_right_steering
    can_node_id: '0x05'
    controller: miControl
  traction:
    joint: rear_right_traction
    can_node_id: '0x06'
    controller: miControl
    min_traction_velocity: -1700
    max_traction_velocity: 1700
usb_joystick:
  device_id: 0
  autorepeat_rate: 20.0
  deadzone: 0.08
  sticky_buttons: false
operator:
  receiver_auto_communication_reset: true
  receiver_can_overrun_advisory: true
  receiver_errors_advisory: true
  require_enable_interlock: false
  require_neutral_rearm: false
  source: remdevice
  usb_driver: joy_node
  usb_mapping_verified: false
  mapping:
    verified: true
    node_id: 10
    axes:
      speed:
        channel: 3
        zero: 0
        full_scale: 255
        invert: false
      steer:
        channel: 2
        zero: 0
        full_scale: 255
        invert: false
      crab:
        channel: 4
        zero: 0
        full_scale: 255
        invert: false
    buttons:
      mode:
        signal: U5
        active_high: false
      boost:
        signal: SP3
        active_high: true
      reset:
        signal: SP4
        active_high: true
      scanner_override:
        signal: D5
        active_high: true
scanners:
  host_ip: 192.168.1.200
  units:
  - name: front_left
    sensor_ip: 192.168.1.5
    frame_id: front_left_scan
    cad_xyz:
    - 1.207101125
    - 0.863406899
    - 0.249261344
    yaw: 0.7853981633974483
  - name: rear_right
    sensor_ip: 192.168.1.6
    frame_id: rear_right_scan
    cad_xyz:
    - -1.207482061
    - -0.860892491
    - 0.249261344
    yaw: -2.356194490192345
safety:
  telemetry_required: false
  bind_address: 0.0.0.0
  port: 9100
  telegram_size: 15
  status_byte_offset: 14
  front_protective_ossd_mask: 3
  rear_protective_ossd_mask: 12
  emergency_stop_mask: 16
  safety_override_mask: 32
  rear_warning_mask: 64
  front_warning_mask: 128
  safety_enable_mask: 0
  sto_mask: 0
  source: flexisoft
battery:
  primary_id: battery1
  participants:
  - id: battery1
    source_address: '0xF3'
    status_pgn: '0xF096'
    soc_pgn: '0xF091'
    voltage_pgn: '0xF090'
  - id: battery2
    source_address: '0xF4'
    status_pgn: '0xF096'
    soc_pgn: '0xF091'
    voltage_pgn: '0xF090'
  readiness:
    require_operational_status: false
    require_not_charging: true
commissioning_pending:
- Verify drive IDs, encoder zero/sign, gearing, current and mechanical travel limits.
- Verify actual battery participants and CAN telegram mapping.
- Confirm independent FlexiSoft/miControl hardware stop and enable mapping.
- Calibrate scanner extrinsics, wheel odometry and uncertainty.
- Capture PAIL controls and verify axis calibration, RP1/B1/B2/STOP and radio-loss
  behavior.
- Configure CAN interfaces and host NIC externally; this package does not do so.
- Battery CAN sources F3/F4 and PGNs F096/F091/F090 observed live; verify each physical
  pack identity and telemetry encoding against its vendor specification.
- Verify miControl native mode 3, velocity target 0x3300, motor rpm and 0x3762 position scaling.
- Verify miControl current mode 2 and 0x3200 mA targets, zero-current stopping and current-mode speed monitoring.
