amcl:
  ros__parameters:
    use_sim_time: true
#    alpha1: 0.2
#    alpha2: 0.2
#    alpha3: 0.2
#    alpha4: 0.2
    base_frame_id: "base_link"
    global_frame_id: "map"
    odom_frame_id: "odom"
    scan_topic: "/mobotic/front_scanner/scan"
    max_particles: 20000
    min_particles: 100000
    set_initial_pose: true
    update_min_d: 0.025  # Updates every 20 centimeters of movement
    robot_model_type: "omnidirectional"
    update_min_a: 0.017  # Updates roughly every 11.5 degrees of rotation
    initial_pose:
      x: 5.383
      y: -0.799
      z: 0.0      # Keep at 0.0 for 2D navigation
      yaw: -0.269    # Rotation in radians

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: "/home/tibor/devel/mobotic/testing_platform_ws/data/positioning_tests/2026-04-24/map/new-area-map-calibrated-laser.yaml" # UPDATE THIS PATH

map_saver:
  ros__parameters:
    use_sim_time: true
