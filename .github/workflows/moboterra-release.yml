name: MoboTerra Docker release

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [build, approve]
        default: build
      commit:
        description: Full Git commit of the candidate to approve
        type: string
      robot:
        description: Robot to receive the approved candidate
        type: choice
        options: [MoboTerra_1, MoboTerra_2, MoboTerra_3]

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.operation == 'build')
    strategy:
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    concurrency: build-${{ github.sha }}-${{ matrix.architecture }}
    permissions:
      contents: read
      packages: write
    outputs:
      amd64: ${{ steps.image.outputs.amd64 }}
      arm64: ${{ steps.image.outputs.arm64 }}
    env:
      GH_TOKEN: ${{ github.token }}
      ARCHITECTURE: ${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build and test the architecture-specific image
        id: image
        shell: bash
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          image="$repository:$ARCHITECTURE-$GITHUB_SHA"
          docker buildx build --load --platform "linux/$ARCHITECTURE" \
            --file deploy/Dockerfile --target current-stack \
            --build-arg "VCS_REF=$GITHUB_SHA" \
            --build-arg "BUILD_DATE=$(date -u +%FT%TZ)" \
            --tag "$image" .
          PYTHONDONTWRITEBYTECODE=1 python3 - "$image" <<'PY'
          import sys
          sys.path.insert(0, 'deploy')
          from current_stack import inspect_image, verify_image
          verify_image(inspect_image(sys.argv[1]))
          PY
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$image" | tee "$RUNNER_TEMP/image-push.txt"
          digest=$(awk '$2 == "digest:" { print $3 }' "$RUNNER_TEMP/image-push.txt")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s=%s\n' "$ARCHITECTURE" "$digest" >> "$GITHUB_OUTPUT"

  publish:
    needs: build
    runs-on: ubuntu-24.04
    concurrency: publish-${{ github.sha }}
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      AMD64_DIGEST: ${{ needs.build.outputs.amd64 }}
      ARM64_DIGEST: ${{ needs.build.outputs.arm64 }}
    steps:
      - name: Publish the multi-platform image and candidate
        shell: bash
        run: |
          tag="docker-$GITHUB_SHA"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Candidate $tag already exists."
            exit 0
          fi
          [[ "$AMD64_DIGEST" =~ ^sha256:[0-9a-f]{64}$ && "$ARM64_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create --tag "$repository:$tag" \
            --metadata-file "$RUNNER_TEMP/image.json" "$repository@$AMD64_DIGEST" "$repository@$ARM64_DIGEST"
          digest=$(jq -er '."containerimage.descriptor".digest' "$RUNNER_TEMP/image.json")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect --raw "$repository@$digest" | jq -e \
            --arg amd64 "$AMD64_DIGEST" --arg arm64 "$ARM64_DIGEST" '
              any(.manifests[]; .digest == $amd64 and .platform.os == "linux" and .platform.architecture == "amd64")
              and any(.manifests[]; .digest == $arm64 and .platform.os == "linux" and .platform.architecture == "arm64")
            ' >/dev/null
          jq -n --arg commit "$GITHUB_SHA" --arg image "$repository@$digest" \
            '{commit: $commit, image: $image}' > "$RUNNER_TEMP/release.json"
          gh release create "$tag" "$RUNNER_TEMP/release.json" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "MoboTerra Docker $GITHUB_SHA" --prerelease --latest=false \
            --notes 'Validated AMD64 and ARM64 candidate. Run the release workflow with operation approve to stage it on a robot.'

  approve:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.operation == 'approve'
    runs-on: ubuntu-24.04
    concurrency: approve-${{ inputs.robot }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_COMMIT: ${{ inputs.commit }}
      ROBOT: ${{ inputs.robot }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Approve a candidate for one robot
        shell: bash
        run: |
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ROBOT" =~ ^MoboTerra_[1-3]$ ]]
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
          gh release download "docker-$RELEASE_COMMIT" --pattern release.json --dir "$RUNNER_TEMP"
          manifest="$RUNNER_TEMP/release.json"
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          jq -e --arg commit "$RELEASE_COMMIT" --arg prefix "$repository@" '
            .commit == $commit and
            (.image | startswith($prefix) and (ltrimstr($prefix) | test("^sha256:[0-9a-f]{64}$")))
          ' "$manifest" >/dev/null
          channel="refs/heads/fleet/$ROBOT"
          existing=$(git ls-remote --refs origin "$channel")
          parent=()
          if [[ -n "$existing" ]]; then
            git fetch --no-tags origin "$channel"
            parent=(-p FETCH_HEAD)
          fi
          blob=$(git hash-object -w "$manifest")
          tree=$(printf '100644 blob %s\trelease.json\n' "$blob" | git mktree)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          approval=$(git commit-tree "$tree" "${parent[@]}" -m "Approve $RELEASE_COMMIT for $ROBOT")
          git push origin "$approval:$channel"
