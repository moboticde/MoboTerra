l="#ffffff"/><text x="1033" y="542" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#288581">Joint feedback</text><rect x="690.5" y="735" width="119" height="24" rx="3" fill="#ffffff"/><text x="750" y="747" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#288581">Joint feedback</text></svg>
