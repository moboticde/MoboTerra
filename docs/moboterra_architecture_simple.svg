ers</text><text x="430" y="227" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#263647">Safety state + scan data</text><rect x="580" y="170" width="220" height="90" rx="12" fill="#e6f3f1" stroke="#6ea8a2" stroke-width="1.8"/><text x="690" y="203" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#263647">Battery monitor</text><text x="690" y="227" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#263647">Vanguard</text><rect x="840" y="170" width="220" height="90" rx="12" fill="#edf0f3" stroke="#8d9ba8" stroke-width="1.8"/><text x="950" y="203" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#263647">Autonomy</text><text x="950" y="227" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#263647">External application</text><rect x="350" y="330" width="420" height="170" rx="12" fill="#eee9fa" stroke="#7959b2" stroke-width="1.8"/><text x="560" y="359" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#263647">Supervisor</text><rect x="370" y="388" width="380" height="94" rx="12" fill="#ffffff" stroke="#c6b4e1" stroke-width="1.8"/><text x="560" y="411" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#263647">Mode state machine</text><text x="560" y="435" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#263647">MANUAL  |  AUTONOMOUS  |  KINEMATICOFF</text><text x="560" y="459" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#263647">Automatic states: SAFETY  |  ERROR</text><rect x="190" y="570" width="240" height="75" rx="12" fill="#fff0df" stroke="#cc9459" stroke-width="1.8"/><text x="310" y="607.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#263647">Kinematics</text><rect x="440" y="715" width="240" height="80" rx="12" fill="#eee9fa" stroke="#7959b2" stroke-width="1.8"/><text x="560" y="743" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#263647">Driver</text><text x="560" y="767" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#263647">Four wheel modules</text><rect x="60" y="725" width="240" height="70" rx="12" fill="#ffffff" stroke="#8d9ba8" stroke-width="1.8"/><text x="180" y="760" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#263647">Odometry</text><rect x="820" y="725" width="240" height="70" rx="12" fill="#ffffff" stroke="#8d9ba8" stroke-width="1.8"/><text x="940" y="760" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#263647">Robot state publisher</text><text x="940" y="682.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#263647">URDF / Xacro</text><text x="560" y="48" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#263647">MoboTerra control architecture</text><text x="560" y="89" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#617083">ROS 2 interface update - design graph</text><text x="935" y="598.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#263647">On