<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="900" viewBox="0 0 1120 900" role="img" aria-labelledby="title description"><title id="title">MoboTerra main control architecture</title><desc id="description">Operator, safety, battery and autonomy feed a supervisor containing the mode state machine. Velocity commands pass through kinematics; direct joint commands reach the driver in KINEMATICOFF. Driver feedback goes to the supervisor, autonomy and robot state publisher. Kinematics supplies measured velocity to odometry.</desc><defs><marker id="command" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#374151"/></marker><marker id="feedback" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#288581"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><polyline points="170,260 170,380 350,380" fill="none" stroke="#374151" stroke-width="2"  stroke-linejoin="round" marker-end="url(#command)"/><polyline points="430,260 430,330" fill="none" stroke="#374151" stroke-width="2"  stroke-linejoin="round" marker-end="url(#command)"/><polyline points="690,260 690,330" fill="none" stroke="#374151" stroke-width="2"  stroke-linejoin="round" marker-end="url(#command)"/><polyline points="950,260 950,380 770,380" fill="none" stroke="#374151" stroke-width="2"  stroke-linejoin="round" marker-end="url(#command)"/><polyline points="430,170 430,130 950,130 950,170" fill="none" stroke="#288581" stroke-width="2" stroke-dasharray="7 5" stroke-linejoin="round" marker-end="url(#feedback)"/><polyline points="770,460 1080,460 1080,215 1060,215" fill="none" stroke="#288581" stroke-width="2" stroke-dasharray="7 5" stroke-linejoin="round" marker-end="url(#feedback)"/><polyline points="430,500 430,535 310,535 310,570" fill="none" stroke="#374151" stroke-width="2"  stroke-linejoin="round" marker-end="url(#command)"/>